ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB0
    frame_id: laser_link
    ignore_array: ""
    baudrate: 512000
    lidar_type: 0            # (Mantenlo en 0, es el correcto)
    device_type: 0
    sample_rate: 20
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: true
    inverted: true
    auto_reconnect: true
    isSingleChannel: false
    intensity: false
    support_motor_dtr: true
    angle_max: 180.0
    angle_min: -180.0
    range_max: 30.0
    range_min: 0.05
    frequency: 12.0           # <--- EL HACK: Sincronizamos el software con la lentitud del motor físico
    invalid_range_is_inf: false
    debug: false